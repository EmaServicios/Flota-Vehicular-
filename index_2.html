<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flota EMA Servicios</title>
<meta name="theme-color" content="#282964">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flota EMA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f2f4f8;color:#1a1d24}
    .top{background:#282964;color:#fff;padding:20px 20px 56px;border-bottom:4px solid #75C5E1}
    .top small{opacity:.85;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
    .top h1{margin:6px 0 0;font-size:22px}
    .card{background:#fff;margin:-40px 16px 16px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden}
    .patente{text-align:center;padding:18px;border-bottom:1px solid #eef0f4}
    .patente span{display:inline-block;border:2px solid #1a1d24;border-radius:8px;padding:6px 16px;font-weight:700;font-size:22px;letter-spacing:.12em}
    .fila{display:flex;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid #eef0f4}
    .fila:last-child{border-bottom:0}
    .fila b{color:#6b7280;font-weight:500}
    .fila span{text-align:right;font-weight:600}
    .dest{background:#f4f9fc}
    .pie{text-align:center;color:#6b7280;font-size:13px;padding:8px 16px 28px;line-height:1.6}
    .pie a{color:#282964}
    form{padding:22px 20px}
    label{display:block;font-size:14px;color:#6b7280;margin:0 0 6px}
    input{width:100%;font-size:16px;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:0 0 16px}
    button{width:100%;font-size:16px;font-weight:600;padding:13px;border:0;border-radius:10px;background:#282964;color:#fff}
    button:disabled{opacity:.6}
    .msg{padding:18px 20px;color:#6b7280}.av{color:#b54708}.ve{color:#b42318}
    .err{color:#b42318;font-size:14px;margin:-4px 0 14px;min-height:1em}
    .sec{padding:10px 20px;background:#f7f8fa;color:#6b7280;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #eef0f4;border-top:1px solid #eef0f4}
    .est{display:block;font-size:12px;font-weight:600;margin-top:3px}
    .ok{color:#067647}.av{color:#b54708}.ve{color:#b42318}
    .doc{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eef0f4;text-decoration:none;color:inherit;font-weight:600}
    .doc i{font-style:normal;font-size:20px}
    .doc:after{content:'›';margin-left:auto;color:#9ca3af;font-size:22px}
    .visor{background:#fff;margin:-40px 16px 16px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;padding:8px}
    .visor img,.visor canvas{display:block;width:100%;height:auto;margin:0 0 8px;border:1px solid #eef0f4}
  
    .top{position:relative}
    .card,.visor{position:relative}
    .atras{position:absolute;top:22px;right:20px;color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px}
    .busca{display:flex;gap:8px;padding:18px 20px}
    .busca input{margin:0;text-transform:uppercase;letter-spacing:.08em}
    .busca button{width:auto;padding:0 18px}
    .res{display:block;padding:14px 20px;border-top:1px solid #eef0f4;text-decoration:none;color:inherit}
    .res b{letter-spacing:.08em}
    .res small{display:block;color:#6b7280;margin-top:2px}
    .logo{display:inline-block;background:#fff;border-radius:12px;padding:8px 14px;margin-bottom:14px}
    .logo img{display:block;height:44px;width:auto}
    .elige{padding:22px 20px;text-align:center}
    .elige p{margin:0 0 10px;color:#6b7280}
    .elige .pat{display:inline-block;border:2px solid #1a1d24;border-radius:8px;padding:6px 16px;font-weight:700;font-size:22px;letter-spacing:.12em;margin-bottom:20px}
    .elige button{margin-bottom:10px}
    .sec2{background:#fff;color:#282964;border:2px solid #282964}
    body.oscuro{background:#1b1c4b}
    .oscuro .pie{color:#aeb0d6}
    .oscuro .pie a{color:#75C5E1}
    .fcard{position:relative;background:#fff;margin:-40px 16px 22px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.25);padding:22px 16px 16px;text-align:center}
    .fpat{font-size:36px;letter-spacing:.06em;font-weight:500;line-height:1.1}
    .fmod{margin-top:8px;font-weight:700;color:#4b5563;text-transform:uppercase;font-size:15px}
    .fsub{margin-top:3px;color:#6b7280;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
    .fdat{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:16px;padding-top:14px;border-top:1px solid #eef0f4}
    .fdat div{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
    .fdat b{display:block;color:#1a1d24;font-size:14px;text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px;word-break:break-word}
    .cerrar{position:absolute;top:-18px;right:-6px;width:46px;height:46px;padding:0;border-radius:12px;background:#75C5E1;color:#282964;font-size:22px;line-height:46px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 22px}
    .tile{position:relative;width:auto;background:rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:16px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
    .tile svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .tile small{font-weight:500;opacity:.7;text-transform:none;font-size:11px;letter-spacing:0}
    .tile.vacio{opacity:.45}
    .pt{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%}
    .pt.ve{background:#f04438}.pt.av{background:#f79009}.pt.ok{background:#12b76a}
    .pill{display:block;width:auto;margin:0 auto 12px;padding:11px 24px;border-radius:999px;background:rgba(117,197,225,.16);border:1px solid #75C5E1;color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
    .zmsg{color:#c9cbe8;font-size:13px;text-align:center;padding:0 24px 12px}
    .zmsg a{color:#75C5E1}
  
    .top{padding-top:calc(20px + env(safe-area-inset-top, 0px))}
    .atras{top:calc(22px + env(safe-area-inset-top, 0px))}
    .inst{margin:0 16px 28px;text-align:center;font-size:13px;color:#6b7280;line-height:1.5}
    .inst button{width:auto;padding:11px 20px}
    body{-webkit-tap-highlight-color:transparent}
    .carga{padding:30px 20px;text-align:center;color:#6b7280}
    .spin{width:34px;height:34px;border:4px solid #e3e6ee;border-top-color:#282964;border-radius:50%;animation:giro .9s linear infinite;margin:0 auto 14px}
    @keyframes giro{to{transform:rotate(360deg)}}
    .lento{font-size:12px;margin-top:8px;min-height:1em}
    .sinred{display:none;position:absolute;top:0;left:0;right:0;background:#b54708;color:#fff;text-align:center;font-size:12px;padding:3px 0}
    .offb{margin:-8px 16px 16px;background:rgba(245,158,11,.16);border:1px solid #f59e0b;color:#fde68a;border-radius:10px;padding:8px 12px;font-size:13px;text-align:center}
    .pill.ok{border-color:#12b76a;background:rgba(18,183,106,.18)}
    .fila span{overflow-wrap:anywhere;min-width:0}


    @media (min-width: 700px) {
      .top { padding-left: calc(50% - 244px); padding-right: calc(50% - 244px); }
      .atras { right: calc(50% - 240px); }
      #app, #instalar { max-width: 520px; margin-left: auto; margin-right: auto; }
    }
</style>
</head>
<body>
<div class="top"><div id="sinred" class="sinred">Sin conexión</div><a href="#" id="atras" class="atras" style="display:none">&#8592; Volver</a><div class="logo"><img src="logo.png" alt="EMA Servicios"></div><h1 id="titulo">Flota</h1></div>
<div id="app"><div class="card"><div class="msg">Cargando…</div></div></div>
<div id="instalar" class="inst"></div>
<script src="config.js"></script>
<script>
    // Conexión con el script de Google: imita google.script.run para reutilizar la interfaz sin cambios.
    function llamarApi(fn, args) {
      var limite = (fn === 'verDocumento' || fn === 'descargarTodo') ? 90000 : 25000;
      var ctl = window.AbortController ? new AbortController() : null;
      var t = ctl ? setTimeout(function () { ctl.abort(); }, limite) : null;
      return fetch(CONFIG.API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // sin "preflight": Google no lo soporta
        body: JSON.stringify({ fn: fn, args: args }),
        redirect: 'follow',
        signal: ctl ? ctl.signal : undefined
      }).then(function (r) {
        clearTimeout(t);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }, function (e) { clearTimeout(t); throw e; }).then(function (r) {
        if (r && r.__fallo) throw new Error('El servidor no pudo procesar el pedido');
        return r;
      });
    }
    window.google = { script: { run: (function mk(ok, fail) {
      return new Proxy({}, { get: function (t, k) {
        if (k === 'withSuccessHandler') return function (f) { return mk(f, fail); };
        if (k === 'withFailureHandler') return function (f) { return mk(ok, f); };
        return function () {
          llamarApi(k, Array.prototype.slice.call(arguments))
            .then(function (r) { if (ok) ok(r); })
            .catch(function (e) { if (fail) fail(e); });
        };
      }});
    })(null, null) } };

    // Botón "Instalar app"
    var promptInstalar = null, mostrarInst = false;
    function esStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
    function esIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); promptInstalar = e; actualizarInstalar(); });
    window.addEventListener('appinstalled', function () { promptInstalar = null; actualizarInstalar(); });
    function actualizarInstalar() {
      var el = document.getElementById('instalar');
      if (!el) return;
      if (esStandalone() || !mostrarInst) { el.innerHTML = ''; return; }
      if (promptInstalar) {
        el.innerHTML = '<button id="binst" class="sec2">&#128242; Instalar app en este celular</button>';
        document.getElementById('binst').onclick = function () {
          promptInstalar.prompt();
          promptInstalar.userChoice.then(function () { promptInstalar = null; actualizarInstalar(); });
        };
      } else if (esIOS()) {
        el.innerHTML = 'Para instalarla en iPhone: tocá <b>Compartir</b> y después <b>Agregar a inicio</b>.';
      } else { el.innerHTML = ''; }
    }
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
</script>
<script>
    var ID = (new URLSearchParams(location.search).get('id') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var KEY = 'flota_sesion';
    var app = document.getElementById('app');
    var titulo = document.getElementById('titulo');
    var atrasEl = document.getElementById('atras');
    var token = null, usuario = '', ultimaBusqueda = '', fichaActual = null, catActual = null;
    try { token = localStorage.getItem(KEY); } catch (e) {}

    var ICONOS = {
      cedulas: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.5-2 2-3 3.5-3s3 1 3.5 3"/><path d="M15 9h3M15 13h3"/>',
      seguros: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
      ruta: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
      titulos: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
      vtv: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
      pagos: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
      transito: '<path d="M12 2v20"/><path d="M9 22h6"/><path d="M12 4h6.5L21 6.5 18.5 9H12z"/><path d="M12 12H5.5L3 14.5 5.5 17H12z"/>',
      contrato: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
      hidrogruas: '<path d="M4 21h10"/><path d="M8 21V9"/><path d="M8 9l10-5"/><path d="M18 4v8"/><circle cx="18" cy="14" r="2"/>',
      credenciales: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M8.5 17c.6-1.8 2-2.5 3.5-2.5s2.9.7 3.5 2.5"/><path d="M10 5.5h4"/>',
      mantenimientos: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
      otros: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'
    };
    function icono(k) { return '<svg viewBox="0 0 24 24">' + (ICONOS[k] || ICONOS.otros) + '</svg>'; }

    /* ---- Copia local (IndexedDB): fichas y documentos para usar sin señal ---- */
    var DIAS_LOCAL = 30, MAX_DOCS = 80;    // las copias se borran a los 30 días; se guardan hasta 80 documentos
    var dbProm = null, seqCarga = 0;
    function abrirDB() {
      if (dbProm) return dbProm;
      dbProm = new Promise(function (ok, no) {
        if (!window.indexedDB) return no(new Error('sin IndexedDB'));
        var rq = indexedDB.open('flota-local', 1);
        rq.onupgradeneeded = function () {
          var db = rq.result;
          db.createObjectStore('fichas', { keyPath: 'pat' });
          db.createObjectStore('docs', { keyPath: 'key' }).createIndex('guardado', 'guardado');
        };
        rq.onsuccess = function () { ok(rq.result); };
        rq.onerror = function () { no(rq.error); };
      });
      return dbProm;
    }
    function idb(store, modo, fn) {
      return abrirDB().then(function (db) {
        return new Promise(function (ok, no) {
          var tx = db.transaction(store, modo), req = fn(tx.objectStore(store));
          tx.oncomplete = function () { ok(req ? req.result : undefined); };
          tx.onerror = tx.onabort = function () { no(tx.error); };
        });
      });
    }
    function guardarFicha(r) {
      return idb('fichas', 'readwrite', function (s) { return s.put({ pat: r.patente, ficha: r, guardado: Date.now() }); }).catch(function () {});
    }
    function leerFicha(pat) { return idb('fichas', 'readonly', function (s) { return s.get(pat); }).catch(function () { return null; }); }
    function listarFichas() { return idb('fichas', 'readonly', function (s) { return s.getAll(); }).then(function (a) { return a || []; }).catch(function () { return []; }); }
    function guardarDoc(rec) {
      rec.guardado = Date.now();
      return idb('docs', 'readwrite', function (s) { return s.put(rec); }).then(limitarDocs).catch(function () {});
    }
    function leerDoc(key) {
      if (!key) return Promise.resolve(null);
      return idb('docs', 'readonly', function (s) { return s.get(key); }).then(function (r) { return r || null; }).catch(function () { return null; });
    }
    function limitarDocs() {
      return abrirDB().then(function (db) {
        return new Promise(function (ok) {
          var tx = db.transaction('docs', 'readwrite'), s = tx.objectStore('docs');
          s.count().onsuccess = function (e) {
            var sobran = e.target.result - MAX_DOCS;
            if (sobran <= 0) return;
            s.index('guardado').openKeyCursor().onsuccess = function (ev) {
              var c = ev.target.result;
              if (c && sobran-- > 0) { s.delete(c.primaryKey); c.continue(); }
            };
          };
          tx.oncomplete = tx.onerror = tx.onabort = function () { ok(); };
        });
      }).catch(function () {});
    }
    function limpiarViejos() {
      var tope = Date.now() - DIAS_LOCAL * 864e5;
      return abrirDB().then(function (db) {
        return new Promise(function (ok) {
          var tx = db.transaction(['fichas', 'docs'], 'readwrite');
          ['fichas', 'docs'].forEach(function (nom) {
            tx.objectStore(nom).openCursor().onsuccess = function (ev) {
              var c = ev.target.result;
              if (!c) return;
              if (c.value.guardado < tope) c.delete();
              c.continue();
            };
          });
          tx.oncomplete = tx.onerror = tx.onabort = function () { ok(); };
        });
      }).catch(function () {});
    }
    function borrarLocal() {
      return abrirDB().then(function (db) {
        return new Promise(function (ok) {
          var tx = db.transaction(['fichas', 'docs'], 'readwrite');
          tx.objectStore('fichas').clear(); tx.objectStore('docs').clear();
          tx.oncomplete = tx.onerror = tx.onabort = function () { ok(); };
        });
      }).catch(function () {});
    }
    function claveDoc(d) { return d && d.mod ? d.id + '|' + d.mod : null; }
    function contarGuardados(docs) {
      return abrirDB().then(function (db) {
        return new Promise(function (ok) {
          var tx = db.transaction('docs', 'readonly'), s = tx.objectStore('docs'), n = 0;
          docs.forEach(function (d) { var k = claveDoc(d); if (k) s.count(k).onsuccess = function (e) { n += e.target.result; }; });
          tx.oncomplete = function () { ok(n); };
          tx.onerror = tx.onabort = function () { ok(0); };
        });
      }).catch(function () { return 0; });
    }
    function fechaHora(ms) {
      var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function cargaHtml(texto) {
      return '<div class="carga"><div class="spin"></div><div>' + h(texto) + '</div><div class="lento" id="lento"></div></div>';
    }
    function avisoLento() {
      var s = ++seqCarga;
      setTimeout(function () {
        var e = document.getElementById('lento');
        if (s === seqCarga && e) e.textContent = 'Sigue cargando… si hay poca señal puede demorar.';
      }, 6000);
    }
    function actualizarRed() {
      var e = document.getElementById('sinred');
      if (e) e.style.display = navigator.onLine === false ? 'block' : 'none';
    }

    function guardar(t) {
      token = t;
      try { if (t) localStorage.setItem(KEY, t); else localStorage.removeItem(KEY); } catch (e) {}
      if (!t) borrarLocal();      // al cerrar sesión se borran las copias guardadas en el celular
    }

    function h(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
    function pantalla(oscuro, volver) {
      document.body.className = oscuro ? 'oscuro' : '';
      mostrarInst = !oscuro; actualizarInstalar();
      atrasEl.style.display = volver ? 'block' : 'none';
      atrasEl.onclick = function (ev) { ev.preventDefault(); if (volver) volver(); };
      window.scrollTo(0, 0);
    }
    function cargando(texto) {
      app.innerHTML = '<div class="card">' + cargaHtml(texto || 'Cargando…') + '</div>';
      avisoLento();
    }

    function errorConexion(msg) {
      app.innerHTML = '<div class="card"><div class="msg">' + h(typeof msg === 'string' ? msg : 'No se pudo conectar. Revisá la señal y probá de nuevo.') + '</div></div>';
    }

    function pie() {
      return '<div class="pie">' + (usuario ? 'Ingresaste como ' + h(usuario) + '<br>' : '') + '<a href="#" id="salir">Cerrar sesión</a></div>';
    }
    function activarPie() {
      document.getElementById('salir').onclick = function (ev) {
        ev.preventDefault();
        var t = token; guardar(null); mostrarLogin('');
        google.script.run.cerrarSesion(t);
      };
    }
    function sinSesion(r) { if (r && r.auth === false) { guardar(null); mostrarLogin(''); return true; } return false; }

    function inicio() {
      limpiarViejos();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
      actualizarRed();
      window.addEventListener('online', actualizarRed);
      window.addEventListener('offline', actualizarRed);
      if (!token) return mostrarLogin('');
      if (ID) mostrarEleccion(); else mostrarBuscador('', null);
    }

    function mostrarEleccion() {
      pantalla(false, null);
      titulo.textContent = '¿Qué querés hacer?';
      app.innerHTML = '<div class="card"><div class="elige">' +
        '<p>Escaneaste el QR de la patente</p><div class="pat">' + h(ID) + '</div>' +
        '<button id="ver">Ver esta patente</button>' +
        '<button id="bus" class="sec2">&#128269; Buscar otra patente</button>' +
        '</div></div>';
      document.getElementById('ver').onclick = function () { verFicha(ID); };
      document.getElementById('bus').onclick = function () { mostrarBuscador('', null); };
    }

    function verFicha(pat) {
      cargando('Buscando la unidad…');
      google.script.run.withFailureHandler(function () {
        // sin conexión: si la unidad está guardada en el celular, se muestra esa copia
        leerFicha(pat).then(function (rec) {
          if (rec) mostrarFicha(rec.ficha, rec.guardado);
          else errorConexion('No se pudo conectar y esta unidad no está guardada en el celular.');
        });
      }).withSuccessHandler(function (r) { mostrarFicha(r); }).verFicha(token, pat);
    }

    function mostrarFicha(r, offGuardado) {
      if (!offGuardado && sinSesion(r)) return;
      var off = !!offGuardado;
      r.__off = offGuardado || 0;
      fichaActual = r; catActual = null; usuario = r.usuario || usuario;
      pantalla(true, null);
      titulo.textContent = 'Vehículo';
      var irBuscar = function (ev) { ev.preventDefault(); mostrarBuscador(ultimaBusqueda, null); };
      if (r.noEncontrado) {
        app.innerHTML = '<div class="card"><div class="msg">No hay datos para la patente <b>' + h(r.patente) + '</b>.</div>' +
          '<div style="padding:0 20px 20px"><button id="otra">&#128269; Buscar otra patente</button></div></div>' + pie();
        document.getElementById('otra').onclick = irBuscar;
        activarPie();
        return;
      }
      if (!off) guardarFicha(r);
      var tiles = '', mant = null;
      r.cats.forEach(function (c) {
        if (c.pill) { mant = c; return; }
        if (!c.mostrar) return;
        var sub = c.n > 0 ? c.n + (c.n === 1 ? ' archivo' : ' archivos') : (c.tieneDatos ? 'Ver datos' : 'Sin cargar');
        tiles += '<button class="tile' + (c.vacio ? ' vacio' : '') + '" data-k="' + c.key + '">' +
          (c.badge ? '<span class="pt ' + c.badge + '"></span>' : '') + icono(c.key) +
          '<span>' + h(c.label) + '</span><small>' + sub + '</small></button>';
      });
      var datos = r.datos.map(function (d) { return '<div>' + h(d.l) + '<b>' + (h(d.v) || '&mdash;') + '</b></div>'; }).join('');
      var puedeGuardar = !off && r.docs && r.docs.length && r.docs.every(function (d) { return d.mod; });
      app.innerHTML =
        '<div class="fcard"><button class="cerrar" id="x" aria-label="Cerrar">&#10005;</button>' +
        '<div class="fpat">' + h(r.patente) + '</div><div class="fmod">' + h(r.modelo) + '</div>' +
        '<div class="fsub">' + h(r.marca) + (r.anio ? ' &middot; ' + h(r.anio) : '') + '</div>' +
        '<div class="fdat">' + datos + '</div></div>' +
        (off ? '<div class="offb">Sin conexión · datos guardados el ' + h(fechaHora(offGuardado)) + '</div>' : '') +
        (r.sinCarpeta ? '<div class="offb">Esta unidad todavía no tiene carpeta de documentos vinculada en Drive. Avisá al administrador de flota.</div>' : '') +
        '<div class="tiles">' + tiles + '</div>' +
        (!off && r.descarga && r.nDocs > 0 ? '<button class="pill" id="zip">Descargar documentación</button><div class="zmsg" id="zmsg"></div>' : '') +
        (puedeGuardar ? '<button class="pill" id="guardar">Guardar para usar sin señal</button><div class="zmsg" id="offmsg"></div>' : '') +
        (mant ? '<button class="pill" id="mant">Mantenimientos</button>' : '') +
        (r.actualizado ? '<div class="pie">Actualizado: ' + h(r.actualizado) + '</div>' : '') + pie();
      document.getElementById('x').onclick = irBuscar;
      Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (el) {
        el.onclick = function () { mostrarCategoria(el.getAttribute('data-k')); };
      });
      if (mant) document.getElementById('mant').onclick = function () { mostrarCategoria('mantenimientos'); };
      var zb = document.getElementById('zip');
      if (zb) zb.onclick = bajarZip;
      if (puedeGuardar) { document.getElementById('guardar').onclick = guardarSinSenal; actualizarPillGuardar(); }
      activarPie();
    }

    function mostrarCategoria(key) {
      var c = null;
      fichaActual.cats.forEach(function (x) { if (x.key === key) c = x; });
      if (!c) return;
      catActual = key;
      pantalla(true, function () { mostrarFicha(fichaActual, fichaActual.__off); });
      titulo.textContent = c.label;
      app.innerHTML = '<div class="card">' +
        (c.html || '<div class="msg">Todavía no hay información ni documentos cargados.</div>') + '</div>' + pie();
      Array.prototype.forEach.call(document.querySelectorAll('.doc'), function (el) {
        el.onclick = function (ev) {
          ev.preventDefault();
          abrirDoc(fichaActual.patente, el.getAttribute('data-id'), el.getAttribute('data-n'), el.getAttribute('data-m'));
        };
      });
      activarPie();
    }

    function abrirDoc(pat, id, nombre, mod) {
      pantalla(true, function () { if (catActual) mostrarCategoria(catActual); else mostrarFicha(fichaActual, fichaActual.__off); });
      titulo.textContent = nombre;
      app.innerHTML = '<div class="visor"><div id="acc"></div><div id="vis">' + cargaHtml('Abriendo documento…') + '</div></div>';
      avisoLento();
      var key = Number(mod) ? id + '|' + mod : null;
      leerDoc(key).then(function (rec) {
        if (rec) return mostrarDocumento(rec, pat);          // copia guardada en el celular: se abre al instante
        var vis = document.getElementById('vis');
        if (!vis) return;
        if (navigator.onLine === false) {
          vis.innerHTML = '<div class="msg">Este documento no está guardado en el celular. Abrilo una vez con señal para poder verlo sin conexión.</div>';
          return;
        }
        google.script.run.withFailureHandler(function () {
          var v = document.getElementById('vis');
          if (v) v.innerHTML = '<div class="msg">No se pudo conectar. Si lo necesitás sin señal, abrilo antes con conexión: queda guardado en el celular.</div>';
        }).withSuccessHandler(function (d) {
          if (sinSesion(d)) return;
          var v = document.getElementById('vis');
          if (!v) return;
          if (d.error) { v.innerHTML = '<div class="msg">' + h(d.error) + '</div>'; return; }
          var nuevo = { key: key, id: id, pat: pat, nombre: d.nombre, tipo: d.tipo, mime: d.mime, data: d.data };
          if (key) guardarDoc(nuevo);
          mostrarDocumento(nuevo, pat, d.descarga);
        }).verDocumento(token, pat, id);
      });
    }

    function mostrarDocumento(rec, pat, permiso) {
      var vis = document.getElementById('vis');
      if (!vis) return;
      var puede = typeof permiso === 'boolean' ? permiso : !!(fichaActual && fichaActual.descarga);
      if (puede && navigator.onLine !== false) {
        var acc = document.getElementById('acc');
        acc.innerHTML = '<button id="dl" class="sec2" style="margin-bottom:6px">&#11015; Descargar</button>' +
          '<div id="dlmsg" class="msg" style="padding:0 0 10px;font-size:13px"></div>';
        document.getElementById('dl').onclick = function () { descargar(rec, pat); };
      }
      if (rec.tipo === 'img') { vis.innerHTML = '<img alt="">'; vis.firstChild.src = 'data:' + rec.mime + ';base64,' + rec.data; return; }
      mostrarPdf(vis, rec.data);
    }

    function actualizarPillGuardar() {
      var bt = document.getElementById('guardar');
      if (!bt || !fichaActual.docs) return;
      contarGuardados(fichaActual.docs).then(function (n) {
        var b = document.getElementById('guardar');
        if (!b) return;
        b.disabled = false;
        if (n >= fichaActual.docs.length) { b.textContent = '\u2713 Guardado en este celular'; b.classList.add('ok'); }
        else { b.textContent = 'Guardar para usar sin señal (' + fichaActual.docs.length + ')'; b.classList.remove('ok'); }
      });
    }

    function guardarSinSenal() {
      var r = fichaActual, docs = r.docs || [], bt = document.getElementById('guardar'), msg = document.getElementById('offmsg');
      var hechos = 0, fallos = 0, i = 0;
      bt.disabled = true; msg.textContent = '';
      function paso() {
        if (i >= docs.length) {
          actualizarPillGuardar();
          var m = document.getElementById('offmsg');
          if (m) m.textContent = fallos ? 'Se guardaron ' + hechos + ' de ' + docs.length + '. Alguno no se pudo guardar: probá de nuevo con mejor señal.'
            : 'Listo: ' + hechos + (hechos === 1 ? ' documento guardado' : ' documentos guardados') + ' en este celular.';
          return;
        }
        var d = docs[i++], key = claveDoc(d);
        bt.textContent = 'Guardando ' + i + ' de ' + docs.length + '…';
        leerDoc(key).then(function (rec) {
          if (rec) { hechos++; return paso(); }
          google.script.run.withFailureHandler(function () { fallos++; paso(); }).withSuccessHandler(function (res) {
            if (sinSesion(res)) return;
            if (!res || !res.data) { fallos++; return paso(); }
            guardarDoc({ key: key, id: d.id, pat: r.patente, nombre: res.nombre, tipo: res.tipo, mime: res.mime, data: res.data })
              .then(function () { hechos++; paso(); });
          }).verDocumento(token, r.patente, d.id);
        });
      }
      paso();
    }

    function mostrarGuardadas() {
      pantalla(false, function () { mostrarBuscador(ultimaBusqueda, null); });
      titulo.textContent = 'Guardadas en el celular';
      listarFichas().then(function (a) {
        a.sort(function (x, y) { return x.pat < y.pat ? -1 : 1; });
        app.innerHTML = '<div class="card">' + (a.length ? a.map(function (x) {
          var f = x.ficha || {};
          return '<a href="#" class="res" data-p="' + h(x.pat) + '"><b>' + h(x.pat) + '</b><small>' + h(((f.marca || '') + ' ' + (f.modelo || '')).trim()) +
            ' · guardada el ' + h(fechaHora(x.guardado)) + '</small></a>';
        }).join('') : '<div class="msg">Todavía no hay unidades guardadas. Se guardan solas cada vez que abrís una ficha con señal.</div>') + '</div>' + pie();
        Array.prototype.forEach.call(document.querySelectorAll('.res'), function (el) {
          el.onclick = function (ev) { ev.preventDefault(); verFicha(el.getAttribute('data-p')); };
        });
        activarPie();
      });
    }

    function bajar(b64, mime, archivo, msg) {
      try {
        var raw = atob(b64), bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
        var a = document.createElement('a');
        a.href = url; a.download = archivo;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        msg.innerHTML = 'Si no empezó la descarga, <a href="' + url + '" target="_blank" rel="noopener">tocá acá para abrirlo</a> y guardalo desde ahí.';
        return true;
      } catch (e) {
        msg.textContent = 'No se pudo descargar. Probá de nuevo o abrí la página en Chrome.';
        return false;
      }
    }

    function descargar(d, pat) {
      var ext = d.tipo === 'pdf' ? '.pdf' : (/png/.test(d.mime) ? '.png' : '.jpg');
      var nombre = (pat + ' - ' + d.nombre).replace(/[\\/:*?"<>|]/g, '') + ext;
      if (bajar(d.data, d.mime, nombre, document.getElementById('dlmsg'))) {
        google.script.run.registrarDescarga(token, pat, d.nombre);
      }
    }

    function bajarZip() {
      var bt = document.getElementById('zip'), msg = document.getElementById('zmsg');
      var fin = function () { bt.disabled = false; bt.textContent = 'Descargar documentación'; };
      bt.disabled = true; bt.textContent = 'Preparando…'; msg.textContent = '';
      google.script.run.withFailureHandler(function () { fin(); msg.textContent = 'No se pudo conectar. Probá de nuevo.'; })
        .withSuccessHandler(function (d) {
          fin();
          if (sinSesion(d)) return;
          if (d.error) { msg.textContent = d.error; return; }
          bajar(d.data, d.mime, d.nombre, msg);
        }).descargarTodo(token, fichaActual.patente);
    }

    function cargarPdfJs(listo) {
      if (window.pdfjsLib) return listo();
      var sc = document.createElement('script');
      sc.src = 'pdf.min.js';      // el visor de PDF está dentro de la app, así funciona sin conexión
      sc.onload = function () { pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js'; listo(); };
      sc.onerror = function () { listo(new Error('pdf.js')); };
      document.head.appendChild(sc);
    }

    function mostrarPdf(vis, b64) {
      cargarPdfJs(function (err) {
        if (err) { vis.innerHTML = '<div class="msg">No se pudo cargar el visor de PDF. Revisá la conexión.</div>'; return; }
        var raw = atob(b64), bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        pdfjsLib.getDocument({ data: bytes }).promise.then(function (pdf) {
          vis.innerHTML = '';
          var ancho = vis.clientWidth || 360, cadena = Promise.resolve();
          for (var n = 1; n <= pdf.numPages; n++) {
            (function (num) {
              var cv = document.createElement('canvas'); vis.appendChild(cv);
              cadena = cadena.then(function () {
                return pdf.getPage(num).then(function (pg) {
                  var base = pg.getViewport({ scale: 1 });
                  var vp = pg.getViewport({ scale: Math.min(3, (ancho * 2) / base.width) });
                  cv.width = vp.width; cv.height = vp.height;
                  return pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
                });
              });
            })(n);
          }
        }).catch(function () { vis.innerHTML = '<div class="msg">No se pudo abrir el PDF.</div>'; });
      });
    }

    function mostrarBuscador(q, r) {
      pantalla(false, null);
      titulo.textContent = 'Buscar vehículo';
      var lista = '';
      if (r && r.error) lista = '<div class="msg">' + h(r.error) + '</div>';
      else if (r && r.resultados) {
        lista = r.resultados.length
          ? r.resultados.map(function (x) {
              return '<a href="#" class="res" data-p="' + h(x.patente) + '"><b>' + h(x.patente) + '</b><small>' +
                h(x.vehiculo) + (x.chofer ? ' · ' + h(x.chofer) : '') + '</small></a>';
            }).join('')
          : '<div class="msg">No hay vehículos con esa patente.</div>';
      }
      app.innerHTML = '<div class="card"><form class="busca" id="fb">' +
        '<input id="q" placeholder="Patente, ej. AH706HV" autocomplete="off" autocapitalize="characters">' +
        '<button>Buscar</button></form>' + lista + '<div id="guardadas"></div></div>' + pie();
      var inp = document.getElementById('q');
      inp.value = q || '';
      if (!r) inp.focus();
      document.getElementById('fb').onsubmit = function (ev) {
        ev.preventDefault();
        var texto = inp.value; ultimaBusqueda = texto;
        cargando('Buscando…');
        google.script.run.withFailureHandler(function () {
          mostrarBuscador(texto, { error: 'No se pudo conectar. Si la unidad está guardada en el celular, la encontrás abajo.' });
        }).withSuccessHandler(function (res) {
          if (sinSesion(res)) return;
          if (res.usuario) usuario = res.usuario;
          if (res.unica) return mostrarFicha(res);
          mostrarBuscador(texto, res);
        }).buscar(token, texto);
      };
      Array.prototype.forEach.call(document.querySelectorAll('.res'), function (el) {
        el.onclick = function (ev) { ev.preventDefault(); verFicha(el.getAttribute('data-p')); };
      });
      listarFichas().then(function (a) {
        var el = document.getElementById('guardadas');
        if (!el || !a.length) return;
        el.innerHTML = '<a href="#" class="res" id="vg">&#128241; Unidades guardadas en este celular (' + a.length + ')</a>';
        document.getElementById('vg').onclick = function (ev) { ev.preventDefault(); mostrarGuardadas(); };
      });
      activarPie();
    }

    function mostrarLogin(msg) {
      pantalla(false, null);
      titulo.textContent = 'Acceso restringido';
      app.innerHTML =
        '<div class="card"><form id="f">' +
        '<label for="em">Mail</label><input id="em" type="email" autocomplete="username" required>' +
        '<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>' +
        '<div class="err" id="er"></div><button id="bt">Ingresar</button></form></div>' +
        '<div class="pie">Solo para personal de EMA Servicios.</div>';
      document.getElementById('er').textContent = msg;
      document.getElementById('f').onsubmit = function (ev) {
        ev.preventDefault();
        var bt = document.getElementById('bt');
        bt.disabled = true; bt.textContent = 'Verificando…';
        google.script.run.withFailureHandler(errorConexion).withSuccessHandler(function (r) {
          if (r.error) {
            bt.disabled = false; bt.textContent = 'Ingresar';
            document.getElementById('er').textContent = r.error;
            return;
          }
          guardar(r.token); inicio();
        }).login(document.getElementById('em').value, document.getElementById('pw').value);
      };
    }
    inicio();
  </script>
</body>
</html>
